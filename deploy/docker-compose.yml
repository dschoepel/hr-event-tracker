# Production deployment — managed as a Dockhand stack.
# Env vars below are populated from Dockhand's Environment Variables panel for
# this stack (mask SESSION_SECRET / OWNER_PASSWORD_HASH there) — see
# ARCHITECTURE.md "Deployment" for the full list and why there's no separate
# host .env file anymore.
# Tier 1: app only
# Tier 2: app + db
# Tier 3: see deploy/supabase/ for the full Supabase stack
services:
  app:
    image: ghcr.io/dschoepel/hr-event-tracker:latest
    container_name: hr-event-tracker
    restart: unless-stopped
    user: "${PUID:-1001}:${PGID:-1001}"
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - DB_PATH=${DB_PATH}
      - GPX_PATH=${GPX_PATH}
      - HOSTNAME=${HOSTNAME}
      - TZ=${TZ}
      - SESSION_SECRET=${SESSION_SECRET}
      - OWNER_PASSWORD_HASH=${OWNER_PASSWORD_HASH}
    volumes:
      - /data/hr-event-tracker/data:/app/data   # SQLite persistence
      - /data/hr-event-tracker/gpx:/app/gpx     # GPX file storage
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

