# Development: starts supporting services only — app runs with `npm run dev`
# Tier 1: nothing to start (SQLite is a local file)
# Tier 2: `docker-compose up` starts postgres
# Production compose is not in this repo — it lives in the schoepels-services repo
services:
  # Tier 2: PostgreSQL for local development
  db:
    image: postgres:17-alpine
    container_name: hr-event-tracker-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-hr-event-tracker}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
